<html>
  <head>
    
    <style>
    ul, li {
        list-style: none; /* 1. 隱藏預設的小圓點/數字 */
        padding-left: 0;  /* 2. 消除左側預設的縮排空間（最關鍵） */
        margin: 0;        /* 3. 順便清除預設的上下外距（依排版需求） */
      }
    .main {
      width:360px;
      margin: 0 auto;
	
      
    
    }
    
    .collect {
      width: 100%;
      font-size: 1.8em;
      text-align: center;
    }

    .collect ul {
      width: 100%;
      display: flex;
    }

    .collect ul li {
      list-style: none;
      width: 15%;
      margin: 0 5px;
      border: #444 solid 1px;
      border-radius: 1em;
      overflow: hidden;
      font-size: .5em;
    }

    .collect ul li img {
      width: 100%;
      transition: ease-in-out .3s;
    }

    .collect li img:hover {
      transform: rotate(15deg) scale(1.3);
      
    }

    .collect li img:active {
      transform: scale(.8);
    }

    .timeforgift {
      width: fit-content;
      margin: 5px auto 0;
      padding: 0 15px;
      background-color: #2a76da;
      border-radius: 15px;
      color: antiquewhite;
    }
    .card-bg {
      margin: 20px auto;
      background-color: #2a76da;
    }
    .card-bg:after{
     display: block;
     content:'';
     position: relative;
     top:-25px;
     width:360px;
     height:25px;
     background-color: #2a76da;
     }

     .card {
       cursor: pointer;
       user-select: none;
       width: 34.3%;
       height: 145px;
       background: #f7d30b;
       margin: 70px auto 0;
       position: relative;
       top:-5px;
       box-shadow:.5px -2px 10px #444;
       transition: ease-in 0.4s;
       transition: ease-out 0.18s;
       text-align: center;
       line-height: 145px;
       font-size: 48px;
       color: #fff999;
     }

     
    .card:hover{

     transform: translate(5px ,-40px) rotate(20deg);
     box-shadow: 0px 8px 10px #444;
     }
    .card:active {
       transform: translate(5px ,-40px) rotate(20deg) scale(0.95);
     }
    
    .saleArea {
      cursor: pointer;
    }
    .customer li{
      margin: 5px 0;
      border: #222 solid 2px;
      border-radius: 8px;
      line-height: 25px;
      transition: .4s ease;
    }

    .customer li:hover {
      background-color: #bb1539;
      color: #fff;
      transform: scale(1.03);
    }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="collect">
        <h1>Collect</h1>
        <ul>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
        </ul>
      </div>
      
      <div class="timeforgift">
        <span>你目前的抽獎次數：3</span>
      </div>
      <div class="card-bg">
        <div class="card">?</div>
      </div>
      <div class="saleArea">
        <div class="customer">
          
        </div>
      </div>

    </div>


    <script src="./script.js"></script>
  </body>
</html>
